services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepseekwriter
    restart: unless-stopped
    ports:
      - "${PORT:-8086}:8086"
    env_file:
      - .env
    environment:
      - PORT=8086
      - NODE_ENV=production
    volumes:
      # Persist SQLite database file
      - ./deepseekwriter.db:/app/deepseekwriter.db
      # Persist generated & uploaded visuals
      - ./storage/images:/app/storage/images
